<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>원판 돌리기</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/Pretendard/dist/web/static/pretendard.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: url(https://ssl.pstatic.net/sstatic/keypage/outside/scui/mobilegame/img/bg_repeat3.jpg) repeat;
        margin: 0;
        padding: 0;
        font-family: 'Pretendard', sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px 20px 100px;
      }

      h1 {
        font-size: 40px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      h3 {
        font-weight: 400;
        font-size: 20px;
        margin-bottom: 30px;
      }
      p {
        font-size: 20px;
        font-weight: 400;
        margin-bottom: 15px;
      }
      #wheelCanvas {
        width: 500px;
        height: 500px;
        aspect-ratio: 1 / 1;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 15px;
      }
      #controls button,
      #controls span,
      #spinBtn {
        display: inline-block;
        font-weight: 400;
        text-align: center;
        vertical-align: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        border: 1px solid #007bff;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.25rem;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out,
          box-shadow 0.15s ease-in-out;
      }
      #controls button,
      #controls span {
        display: block;
        width: 35px;
        height: 35px;
        line-height: 35px;
      }
      #controls button,
      #spinBtn {
        color: #fff;
        background-color: #007bff;
        border-color: #007bff;
        cursor: pointer;
      }
      #controls button:hover,
      #spinBtn:hover {
        color: #fff;
        background-color: #0069d9;
        border-color: #0062cc;
      }
      #controls span {
        color: #222222;
        background-color: #ffffff;
        border-color: #222222;
      }

      #spinBtn {
        margin-top: 30px;
        font-size: 18px;
        font-weight: 600;
        padding: 5px 10px;
      }

      #inputsContainer {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        width: 100%;
        margin-bottom: 20px;
        padding: 10px 20px;
        max-width: 730px;
      }

      .input-field input[type='text'] {
        display: block;
        width: 100%;
        height: calc(1.5em + 0.75rem + 2px);
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #495057;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }

      @media screen and (max-width: 600px) {
        .input-field {
          width: 100%;
        }
        #wheelCanvas {
          width: 100%;
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>원판 돌리기</h1>
      <h3>원판을 돌려 결정해보세요!</h3>

      <p>1. 원판 선택지 개수를 정해주세요</p>

      <!-- 인원수 조정 (최소 2명, 최대 15명) -->
      <div id="controls">
        <button id="minusBtn">-</button>
        <span id="peopleCount">2</span>
        <button id="plusBtn">+</button>
      </div>

      <p>2. 원판 선택지를 입력해주세요.</p>

      <!-- 이름 입력 필드 (동적으로 생성) -->
      <div id="inputsContainer"></div>

      <!-- 돌림판을 그릴 Canvas -->
      <canvas id="wheelCanvas" width="500" height="500"></canvas>

      <!-- 돌리기 버튼 -->
      <div>
        <button id="spinBtn">돌리기</button>
      </div>
    </div>

    <script>
      /***********************
       * 강제 당첨 이름 배열 *
       * (배열에 있는 이름이 입력되어 있다면 해당 후보 중 하나가 당첨됨)
       ***********************/
      const forcedNames = ['강현우', '신예지', '최혜진'];

      // 전역 변수 설정
      let people = 2; // 기본/최소 인원수 2
      let rotationAngle = 0; // 현재 돌림판 회전 각 (라디안)
      const maxCount = 15;
      const minCount = 2;
      let finalWinningIndex = null; // 애니메이션 후 최종 당첨 인덱스 저장

      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const peopleCountDisplay = document.getElementById('peopleCount');
      const inputsContainer = document.getElementById('inputsContainer');
      const plusBtn = document.getElementById('plusBtn');
      const minusBtn = document.getElementById('minusBtn');
      const spinBtn = document.getElementById('spinBtn');

      // 인원수 업데이트 시 input 필드와 돌림판 다시 그리기
      function updatePeopleCount() {
        peopleCountDisplay.textContent = people;
        createInputFields();
        drawWheel();
      }

      // "+" 버튼 클릭 (최대 15명)
      plusBtn.addEventListener('click', function () {
        if (people < maxCount) {
          people++;
          updatePeopleCount();
        } else {
          alert('최대 선택지 개수는' + maxCount + '개 입니다.');
        }
      });

      // "–" 버튼 클릭 (최소 2명)
      minusBtn.addEventListener('click', function () {
        if (people > minCount) {
          people--;
          updatePeopleCount();
        } else {
          alert('최소 선택지 개수는' + minCount + '개 입니다.');
        }
      });

      // 인원수에 맞춰 이름 입력 필드를 동적으로 생성
      function createInputFields() {
        const existingInputs = Array.from(inputsContainer.querySelectorAll('.nameInput'));
        const existingValues = existingInputs.map((input) => input.value.trim()); // 기존 입력값 저장

        // 현재 인원 수에 맞게 필드 조정
        if (existingInputs.length < people) {
          // 추가: 부족한 만큼 새로운 input 생성
          for (let i = existingInputs.length; i < people; i++) {
            createInputField(i, '');
          }
        } else if (existingInputs.length > people) {
          // 삭제: 초과된 input 제거
          for (let i = existingInputs.length - 1; i >= people; i--) {
            inputsContainer.removeChild(existingInputs[i].parentNode);
          }
        }

        // 기존 입력값 복원
        const updatedInputs = inputsContainer.querySelectorAll('.nameInput');
        updatedInputs.forEach((input, idx) => {
          input.value = existingValues[idx] || ''; // 기존 값 유지, 없으면 빈칸
        });
      }

      // 개별 입력 필드 생성 함수
      function createInputField(index, value) {
        const div = document.createElement('div');
        div.className = 'input-field';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `${index + 1} 선택지를 입력해주세요.`;
        input.value = value; // 기존 값 유지
        input.classList.add('nameInput');
        div.appendChild(input);
        inputsContainer.appendChild(div);
      }

      // 돌림판 그리기 함수 (각 영역은 파스텔 톤 색상)
      function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) - 10;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius + 10, 0, 2 * Math.PI);
        ctx.fillStyle = '#3d2b1f';
        ctx.fill();

        // 입력된 이름을 가져오기 (빈 칸이면 기본 이름 사용)
        const nameInputs = inputsContainer.querySelectorAll('.nameInput');
        const names = [];
        nameInputs.forEach((input, idx) => {
          names.push(input.value.trim() || `선택지 ${idx + 1}`);
        });

        const anglePerSegment = (2 * Math.PI) / people;
        for (let i = 0; i < people; i++) {
          const startAngle = i * anglePerSegment + rotationAngle;
          const endAngle = startAngle + anglePerSegment;

          // 파스텔 톤 색상 (HSL: 채도 70%, 밝기 80%)
          let hue = i * (360 / people);
          let color = `hsl(${hue}, 70%, 80%)`;

          // 부채꼴 영역 그리기
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.stroke();

          // 영역 중앙에 이름 텍스트 표시
          ctx.save();
          ctx.translate(centerX, centerY);
          const textAngle = startAngle + anglePerSegment / 2;
          ctx.rotate(textAngle);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#000';
          ctx.font = '16px Pretendard';
          ctx.fillText(names[i], radius - 10, 5);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(centerX, centerY, 10, 0, 2 * Math.PI);
        ctx.fillStyle = '#444';
        ctx.fill();

        // 상단에 고정된 포인터(화살표) 그리기
        drawPointer();
      }

      // 상단 중앙에 포인터(화살표) 그리기
      function drawPointer() {
        const centerX = canvas.width / 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 20, 10);
        ctx.lineTo(centerX, 50);
        ctx.lineTo(centerX + 20, 10);
        ctx.closePath();
        ctx.fillStyle = '#5a3d1f';
        ctx.fill();
      }

      // 이름 입력 시마다 돌림판 다시 그리기
      inputsContainer.addEventListener('input', drawWheel);

      // 돌리기 버튼 클릭 이벤트
      spinBtn.addEventListener('click', function () {
        const nameInputs = inputsContainer.querySelectorAll('.nameInput');
        // 모든 이름이 입력되어 있는지 확인
        for (let input of nameInputs) {
          if (input.value.trim() === '') {
            alert('모든 선택지를 입력해주세요.');
            return;
          }
        }

        // 버튼 및 입력 필드 비활성화
        spinBtn.disabled = true;
        plusBtn.disabled = true;
        minusBtn.disabled = true;
        nameInputs.forEach((input) => (input.disabled = true));

        // 강제 당첨 기능: forcedNames 배열에 포함된 이름의 인덱스를 수집
        const forcedIndices = [];
        nameInputs.forEach((input, idx) => {
          const val = input.value.trim();
          if (forcedNames.includes(val)) {
            forcedIndices.push(idx);
          }
        });

        let winningIndex;
        if (forcedIndices.length > 0) {
          // 강제 후보가 여러 개라면 그 중 하나를 무작위 선택
          winningIndex = forcedIndices[Math.floor(Math.random() * forcedIndices.length)];
        } else {
          winningIndex = Math.floor(Math.random() * people);
        }

        finalWinningIndex = winningIndex; // 애니메이션 후 결과 확인에 사용

        // --- 회전 각도 계산 (항상 시계방향, 최소 3회전 이상, 자연스러운 배치 적용) ---
        // 현재 회전 각(°)
        const initialDeg = (rotationAngle * 180) / Math.PI;
        // 각 영역의 크기 (°)
        const anglePerSector = 360 / people;
        // 당첨 영역의 중앙 (°)
        const sectorCenter = winningIndex * anglePerSector + anglePerSector / 2;
        // 원래라면 이 sectorCenter가 -90°(상단)과 맞춰져야 함
        // → targetCenter = -90 - sectorCenter;
        // 이제 여기에 무작위 오프셋(offset)을 추가하여 자연스럽게 만듭니다.
        const offset = Math.random() * (anglePerSector / 2) - anglePerSector / 4; // -¼~+¼ 영역 내
        const targetCenter = -90 - sectorCenter + offset;

        // 현재 각도와 목표 각도 차이를 계산 (항상 양수, 시계방향)
        let diff = targetCenter - initialDeg;
        while (diff < 0) {
          diff += 360;
        }
        // 최소 3회전 이상 (추가 회전수: 3~5회전)
        const extraSpins = Math.floor(Math.random() * 3) + 3; // 3, 4, 또는 5회전
        const targetAngleDeg = initialDeg + extraSpins * 360 + diff;
        // -----------------------------------------------------

        animateRotation(targetAngleDeg);
      });

      // 회전 애니메이션 (3초 동안, 항상 시계방향)
      function animateRotation(targetDeg) {
        const duration = 3000; // ms
        const startTime = performance.now();
        const initialDeg = (rotationAngle * 180) / Math.PI;

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeOutCubic(progress);
          const currentDeg = initialDeg + (targetDeg - initialDeg) * easedProgress;
          rotationAngle = (currentDeg * Math.PI) / 180;
          drawWheel();
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            // 애니메이션 종료 시 정확한 각도로 설정
            rotationAngle = (targetDeg * Math.PI) / 180;
            drawWheel();
            announceWinner();
          }
        }
        requestAnimationFrame(animate);
      }

      // easeOutCubic easing 함수
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      // 당첨 결과를 출력 (애니메이션 시 계산된 당첨 인덱스를 그대로 사용)
      function announceWinner() {
        const nameInputs = inputsContainer.querySelectorAll('.nameInput');
        const winningName = nameInputs[finalWinningIndex].value;
        alert('당첨: ' + winningName);

        // 버튼 및 입력 필드 활성화
        spinBtn.disabled = false;
        plusBtn.disabled = false;
        minusBtn.disabled = false;
        nameInputs.forEach((input) => (input.disabled = false));
      }

      // 초기 실행: input 필드 생성 및 돌림판 그리기
      createInputFields();
      drawWheel();
    </script>
  </body>
</html>
